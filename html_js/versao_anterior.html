<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste WISC-IV</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 700px; margin: auto; }
    label { display: block; margin: 10px 0 5px; }
    input[type="number"] { width: 60px; }
  </style>
</head>
<body>

<h2>Informações do Paciente</h2>

<form id="form-wisc">

  <!-- Campo para o nome do paciente -->
  <label>Nome do paciente:
    <input type="text" id="nome" name="nome" required>
  </label>

  <!-- Campo para data de nascimento -->
  <label>Data de nascimento:
    <input type="date" id="nascimento" name="nascimento" required>
  </label>

  <!-- Campo para data de aplicação do teste -->
  <label>Data da aplicação:
    <input type="date" id="aplicacao" name="aplicacao" required>
  </label>

  <!-- Aqui será exibida a idade calculada automaticamente -->
  <div id="idade"></div>

  <h3>Subtestes (valores entre 0 e 19)</h3>

  <!-- Subtestes principais e opcionais -->
  <label>Cubos (CB):
    <input type="number" name="CB" min="0" max="19" required>
  </label>

  <label>Semelhanças (SM):
    <input type="number" name="SM" min="0" max="19" required>
  </label>

  <label>Dígitos (DG):
    <input type="number" name="DG" min="0" max="19" required>
  </label>

  <label>Conceitos Figurativos (CN):
    <input type="number" name="CN" min="0" max="19" required>
  </label>

  <label>Código (CD):
    <input type="number" name="CD" min="0" max="19" required>
  </label>

  <label>Seq de Num e Letras (SNL):
    <input type="number" name="SNL" min="0" max="19" required>
  </label>

  <label>Raciocínio Matricial (RM):
    <input type="number" name="RM" min="0" max="19" required>
  </label>

  <label>Compreensão (CO):
    <input type="number" name="CO" min="0" max="19" required>
  </label>

  <label>Procurar Símbolos (PS):
    <input type="number" name="PS" min="0" max="19" required>
  </label>

  <!-- Subtestes opcionais (sem required) -->
  <label>Completar Figuras (CF):
    <input type="number" name="CF" min="0" max="19">
  </label>

  <label>Cancelamento (CA):
    <input type="number" name="CA" min="0" max="19">
  </label>

  <label>Informação (IN):
    <input type="number" name="IN" min="0" max="19">
  </label>

  <label>Aritimética (AR):
    <input type="number" name="AR" min="0" max="19">
  </label>

  <label>Raciocínio com Palavras (RP):
    <input type="number" name="RP" min="0" max="19">
  </label>

  <!-- Botão para calcular os resultados (função ainda não implementada) -->
  <br><br>
  <button type="button" onclick="calcularResultados()">Calcular Resultados</button>

</form>

<script>
  // Variáveis para armazenar a idade calculada
  let idadeAnos = 0;
  let idadeMeses = 0;

  // Escutadores para cálculo automático de idade
  document.getElementById('aplicacao').addEventListener('change', calcularIdade);
  document.getElementById('nascimento').addEventListener('change', calcularIdade);

  // Função que calcula idade em anos e meses
  function calcularIdade() {
    const nascimento = new Date(document.getElementById('nascimento').value);
    const aplicacao = new Date(document.getElementById('aplicacao').value);

    if (isNaN(nascimento) || isNaN(aplicacao)) return;

    let anos = aplicacao.getFullYear() - nascimento.getFullYear();
    let meses = aplicacao.getMonth() - nascimento.getMonth();

    if (aplicacao.getDate() < nascimento.getDate()) {
      meses -= 1;
    }

    if (meses < 0) {
      anos -= 1;
      meses += 12;
    }

    idadeAnos = anos;
    idadeMeses = meses;

    document.getElementById('idade').textContent = `Idade: ${idadeAnos} anos e ${idadeMeses} meses`;
  }

  // Botão "Calcular Resultados" - apenas mostra a idade calculada
  function calcularResultados() {
    // Garante que os dados estejam atualizados
    if (idadeAnos === 0 && idadeMeses === 0) {
      calcularIdade();
    }

    // Exibe a idade num alerta
    alert(`A criança tem ${idadeAnos} anos e ${idadeMeses} meses.`);
  }
</script>

</body>
</html>
