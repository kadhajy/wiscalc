<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste WISC-IV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-4">

<div class="container" style="max-width: 700px;">
  <h2 class="mb-4 text-center">Informações do Paciente</h2>

  <form id="form-wisc" action="/calcular" method="post">

    <div class="mb-3">
      <label for="nome" class="form-label">Nome do paciente</label>
      <input type="text" class="form-control" id="nome" name="nome" required>
    </div>

    <div class="mb-3">
      <label for="nascimento" class="form-label">Data de nascimento</label>
      <input type="date" class="form-control" id="nascimento" name="nascimento" required>
    </div>

    <div class="mb-3">
      <label for="data_apli" class="form-label">Data da aplicação</label>
      <input type="date" class="form-control" id="data_apli" name="data_apli" required>
    </div>

    <div id="idade" class="mb-4"></div>

    <h3 class="mt-4 mb-3">Subtestes (valores entre 0 e 19)</h3>

    <!-- Subtestes em uma coluna -->
    <div class="mb-3">
      <label class="form-label">Cubos (CB)</label>
      <input type="number" class="form-control" name="CB" min="0" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Semelhanças (SM)</label>
      <input type="number" class="form-control" name="SM" min="0" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Dígitos (DG)</label>
      <input type="number" class="form-control" name="DG" min="0" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Conceitos Figurativos (CN)</label>
      <input type="number" class="form-control" name="CN" min="0" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Código (CD)</label>
      <input type="number" class="form-control" name="CD" min="0" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Vocabulário (VC)</label>
      <input type="number" class="form-control" name="VC" min="0" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Sequência de Números e Letras (SNL)</label>
      <input type="number" class="form-control" name="SNL" min="0" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Raciocínio Matricial (RM)</label>
      <input type="number" class="form-control" name="RM" min="0" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Compreensão (CO)</label>
      <input type="number" class="form-control" name="CO" min="0" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Procurar Símbolos (PS)</label>
      <input type="number" class="form-control" name="PS" min="0" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Completar Figuras (CF)</label>
      <input type="number" class="form-control" name="CF" min="0">
    </div>

    <div class="mb-3">
      <label class="form-label">Cancelamento (CA)</label>
      <input type="number" class="form-control" name="CA" min="0">
    </div>

    <div class="mb-3">
      <label class="form-label">Informação (IN)</label>
      <input type="number" class="form-control" name="IN" min="0">
    </div>

    <div class="mb-3">
      <label class="form-label">Aritmética (AR)</label>
      <input type="number" class="form-control" name="AR" min="0">
    </div>

    <div class="mb-3">
      <label class="form-label">Raciocínio com Palavras (RP)</label>
      <input type="number" class="form-control" name="RP" min="0">
    </div>

    <div class="mt-4">
      <button type="submit" class="btn btn-primary w-100">Calcular Resultados</button>
    </div>

  </form>
</div>

</body>
</html>
